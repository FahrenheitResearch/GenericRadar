# GenericRadar cross-platform release pipeline.
#
# This file lives OUTSIDE .github/ in the dev repo on purpose: nothing here
# may ever run against the dev repository. The release process (see
# docs/RELEASING.md) copies it into the PUBLIC snapshot as
# .github/workflows/release.yml, where a tag push builds the six platform
# archives and attaches them to the release the maintainer already created.
# (That process lives in the development repository; the public tree carries
# only this pipeline.)
#
# The canonical `GenericRadar.exe` asset is NOT produced here: it is the
# locally built, locally flown Windows binary the maintainer uploads when
# creating the release. This workflow adds the platform archives beside it
# (including a CI windows-x64 zip for completeness; the bare .exe remains the
# verified one). Non-Windows builds compile from the same tagged source but
# are not flight-tested by the maintainer; the release notes say so.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: GenericRadar

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Create release if the maintainer has not already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists (normal: the maintainer creates it with the verified Windows exe first)."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "GenericRadar ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  build:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: GenericRadar-windows-x64
            package: windows
          - os: windows-11-arm
            artifact_name: GenericRadar-windows-arm64
            package: windows
          - os: ubuntu-24.04
            artifact_name: GenericRadar-linux-x64
            package: linux
          - os: ubuntu-24.04-arm
            artifact_name: GenericRadar-linux-arm64
            package: linux
          - os: macos-15-intel
            artifact_name: GenericRadar-macos-intel
            package: macos
          - os: macos-15
            artifact_name: GenericRadar-macos-apple-silicon
            package: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev

      - name: Use stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binary
        run: cargo build --release -p workstation_app --bin GenericRadar

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # The bare executable is the asset a Windows user actually wants:
          # download it and run it, with no unpacking step. The zip beside
          # it carries the same bytes plus the README and the two licences,
          # for anyone who wants the notices with the binary.
          Copy-Item target\release\GenericRadar.exe "dist\${{ matrix.artifact_name }}.exe"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target\release\GenericRadar.exe package\GenericRadar.exe
          Copy-Item README.md package\README.md
          Copy-Item LICENSE-MIT package\LICENSE-MIT
          Copy-Item LICENSE-APACHE package\LICENSE-APACHE
          Compress-Archive -Path package\* -DestinationPath "dist\${{ matrix.artifact_name }}.zip" -Force

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="0.0.0"
          app="GenericRadar.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/release/${BIN_NAME}" "$app/Contents/MacOS/${BIN_NAME}"
          cp README.md "$app/Contents/Resources/README.md"
          cp LICENSE-MIT "$app/Contents/Resources/LICENSE-MIT"
          cp LICENSE-APACHE "$app/Contents/Resources/LICENSE-APACHE"
          chmod +x "$app/Contents/MacOS/${BIN_NAME}"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>GenericRadar</string>
            <key>CFBundleExecutable</key>
            <string>GenericRadar</string>
            <key>CFBundleIdentifier</key>
            <string>research.fahrenheit.genericradar</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>GenericRadar</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          # Ad-hoc sign the assembled bundle. On Apple Silicon a quarantined
          # bundle with no valid signature is reported to the user as
          # "damaged and can't be opened", which reads as a corrupt download
          # rather than as an unsigned one. An ad-hoc signature turns that
          # into the ordinary unidentified-developer prompt, which a user can
          # clear in System Settings > Privacy & Security > Open Anyway.
          # Developer ID signing and notarisation (below) remove the prompt
          # entirely; ad-hoc is the floor when no certificate is configured.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

      # Real signing, when the repository has an Apple Developer ID and an App
      # Store Connect key. Absent the secrets this is skipped and the ad-hoc
      # signed bundle ships instead - a release is never blocked on it.
      - name: Detect macOS signing secrets
        id: macos_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$MACOS_CERTIFICATE_BASE64" && -n "$MACOS_CERTIFICATE_PWD"             && -n "$ASC_API_KEY_BASE64" && -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Developer ID secrets; shipping an ad-hoc signed macOS app."
          fi

      - name: Sign and notarize macOS app
        if: runner.os == 'macOS' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="GenericRadar.app"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain"             -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:             -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain"             | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity found in certificate" >&2
            exit 1
          fi
          codesign --force --deep --options runtime --timestamp --sign "$identity" "$app"
          codesign --verify --deep --strict "$app"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip"             --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID"             --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=4 "$app"
          security delete-keychain "$keychain"

      - name: Zip macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="GenericRadar.app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${{ matrix.artifact_name }}.zip"

      # Linux stays a tarball rather than a bare binary on purpose: an asset
      # downloaded through a browser arrives without its executable bit, so a
      # bare ELF would need chmod +x before it ran, while a tarball carries the
      # mode. macOS likewise must stay an archive - a .app is a directory, and
      # the bundle is what holds the Info.plist and the code signature.
      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist" "package/${BIN_NAME}"
          cp "target/release/${BIN_NAME}" "package/${BIN_NAME}/${BIN_NAME}"
          cp README.md "package/${BIN_NAME}/README.md"
          cp LICENSE-MIT "package/${BIN_NAME}/LICENSE-MIT"
          cp LICENSE-APACHE "package/${BIN_NAME}/LICENSE-APACHE"
          tar -C package -czf "dist/${{ matrix.artifact_name }}.tar.gz" "${BIN_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
