[package]
name = "settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

# Dev-only. `tests/workstation_settings_ui.rs` includes the workstation's real
# settings window (`workstation_app/src/settings_ui.rs`) so its focused tests
# can run independently of the full application. The same include drives
# `examples/settings_preview`, which opens and photographs the real window.
# None of these reach the shipped `settings` library: the firewall in
# `workstation_app/tests/architecture.rs` reads only `[dependencies]`, and this
# section is not it.
[dev-dependencies]
analyst_runtime = { path = "../analyst_runtime" }
color_tables = { path = "../color_tables" }
eframe.workspace = true
image.workspace = true
map_scene = { path = "../map_scene" }
radar_core = { path = "../radar_core" }
render2d = { path = "../render2d" }
