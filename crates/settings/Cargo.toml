[package]
name = "settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

# Dev-only. The workstation's settings window (`workstation_app/src/settings_ui.rs`)
# is also compiled and unit-tested here through `tests/workstation_settings_ui.rs`
# (a `#[path]` include), so the module is exercised against this crate's own
# public API and not only through the binary that links it. The same include
# drives `examples/settings_preview`,
# which opens the real window and photographs it. None of these reach the
# shipped `settings` library: the firewall in `workstation_app/tests/architecture.rs`
# reads only `[dependencies]`, and this section is not it.
[dev-dependencies]
analyst_runtime = { path = "../analyst_runtime" }
color_tables = { path = "../color_tables" }
eframe.workspace = true
image.workspace = true
map_scene = { path = "../map_scene" }
radar_core = { path = "../radar_core" }
render2d = { path = "../render2d" }
