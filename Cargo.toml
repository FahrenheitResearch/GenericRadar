[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.6.2"
rust-version = "1.94"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FahrenheitResearch/GenericRadar"

[workspace.dependencies]
byteorder = "1.5"
bytemuck = { version = "1.25", features = ["derive"] }
bzip2 = { version = "0.6", default-features = false, features = ["bzip2-sys"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
eframe = "0.34.3"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# `jpeg` is not optional decoration: every tile the USGS National Map basemap
# services return is `Content-Type: image/jpeg` (their tile caches are built
# with `format: MIXED`, which is JPEG for opaque tiles and PNG where there is
# transparent no-data). Without it `basemap_tiles` fails to decode 100% of real
# imagery tiles and the basemap is silently blank. `zune-core`/`zune-jpeg` are
# already in Cargo.lock via `tiff`, so this adds compile time, not a new
# dependency. `basemap_tiles::decode` has a test that decodes a real captured
# JPEG tile so the feature cannot be dropped by a later dependency tidy-up.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libdeflate-sys = "1.25.2"
quick-xml = { version = "0.39", features = ["serialize"] }
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "fat"
codegen-units = 1
